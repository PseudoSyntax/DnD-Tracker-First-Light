name: Validate campaign data

on:
  pull_request:
    paths:
      - campaign-data.json
      - scripts/validate-data.mjs
  push:
    branches: [main]
    paths:
      - campaign-data.json
      - scripts/validate-data.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-data.mjs

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Light | Interactive Campaign Map</title>
    <meta
      name="description"
      content="Interactive campaign map for the First Light adventure."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      :root {
        --bg: #0b1114;
        --panel: rgba(14, 18, 21, 0.86);
        --panel-soft: rgba(255, 255, 255, 0.04);
        --gold: #d9b56b;
        --ink: #f4ead7;
        --muted: #d5cdb8;
        --edge: rgba(255,255,255,0.09);
        --danger: #cf7c6f;
        --success: #9ac285;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background:
          radial-gradient(circle at top, rgba(94, 119, 106, 0.16), transparent 32%),
          linear-gradient(135deg, #06090b 0%, #0f1719 35%, #111b20 100%);
        color: var(--ink);
        font-family: "Inter", sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 28px;
      }
      .map-page {
        width: min(1300px, 100%);
        background: rgba(10, 15, 16, 0.8);
        border: 1px solid var(--edge);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        border-bottom: 1px solid var(--edge);
      }
      .back-link {
        text-decoration: none;
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 700;
      }
      .header-title {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2.2rem, 4vw, 3.4rem);
        margin: 0;
      }
      .map-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(320px, 0.8fr);
        gap: 18px;
        padding: 18px;
      }
      .map-stage {
        position: relative;
        border: 1px solid var(--edge);
        background: #0d1113;
        overflow: hidden;
        min-height: 600px;
      }
      .map-stage img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.85) contrast(1.08);
      }
      .map-pin {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        padding: 0;
        background: radial-gradient(circle, #f7e7b4 0%, #d7b157 45%, #8d671e 100%);
        border: 2px solid rgba(255,255,255,0.8);
        box-shadow: 0 0 0 7px rgba(215,177,87,0.2), 0 0 18px rgba(215,177,87,0.45);
        transform: translate(-50%, -50%);
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }
      .map-pin:hover, .map-pin.selected {
        transform: translate(-50%, -50%) scale(1.16);
        box-shadow: 0 0 0 8px rgba(215,177,87,0.26), 0 0 22px rgba(215,177,87,0.6);
      }
      .map-pin.selected {
        outline: 2px solid rgba(255,255,255,0.9);
      }
      .map-details {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--edge);
        padding: 18px;
      }
      .panel-kicker {
        margin: 0 0 8px;
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.66rem;
        font-weight: 700;
      }
      .chapter-summary h2 {
        margin: 0 0 12px;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2.2rem, 3vw, 3rem);
        line-height: 0.9;
      }
      .chapter-summary p {
        color: var(--muted);
        line-height: 1.7;
        margin: 0 0 18px;
      }
      .meta-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .meta-list span {
        display: inline-block;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.025);
        padding: 8px 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.68rem;
        color: var(--muted);
      }
      .editor-panel {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--edge);
      }
      .editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .editor-header h3 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.8rem, 2vw, 2.5rem);
      }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      button {
        font: inherit;
        border: 1px solid var(--edge);
        background: rgba(255,255,255,0.03);
        color: var(--ink);
        padding: 9px 12px;
        cursor: pointer;
      }
      button:hover { border-color: rgba(215,181,107,0.75); }
      button.primary { background: rgba(217,181,107,0.12); }
      button.alert { border-color: rgba(207,124,111,0.7); }
      .point-form {
        display: grid;
        gap: 10px;
      }
      .point-form label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.74rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .point-form input,
      .point-form textarea {
        width: 100%;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--edge);
        color: var(--ink);
        padding: 10px 12px;
        font: inherit;
      }
      .point-form textarea {
        min-height: 100px;
        resize: vertical;
      }
      .coord-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .status-text {
        margin-top: 10px;
        color: var(--gold);
        min-height: 18px;
        font-size: 0.74rem;
      }
      @media (max-width: 860px) {
        .map-layout {
          grid-template-columns: 1fr;
        }
        .map-stage {
          min-height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <div class="map-page">
      <header class="topbar">
        <a class="back-link" href="index.html">← Return to Journal</a>
        <h1 class="header-title">Campaign Atlas</h1>
      </header>

      <main class="map-layout">
        <div class="map-stage" id="mapStage">
          <img src="image-1.png" alt="Interactive campaign map" />
        </div>

        <aside class="map-details" aria-live="polite">
          <p class="panel-kicker">Waypoint</p>
          <div class="chapter-summary">
            <h2 id="map-title">The Whispering Forest</h2>
            <p id="map-summary">
              The party enters the Blackbriar frontier, where a forgotten lantern is said to have warmed the land before the first winter of ruin.
            </p>
            <div class="meta-list">
              <span id="map-location">Forest of Hollow Pine</span>
              <span id="map-session">Session 01</span>
            </div>
          </div>

          <div class="editor-panel">
            <div class="editor-header">
              <h3>Map Editor</h3>
            </div>

            <div class="button-row">
              <button id="addPointBtn" class="primary" type="button">Add Point</button>
              <button id="saveLocalBtn" type="button">Save Browser</button>
              <button id="publishBtn" type="button">Publish to Main</button>
            </div>

            <form class="point-form" id="pointForm">
              <label>
                Title
                <input id="titleInput" type="text" value="The Whispering Forest" />
              </label>

              <label>
                Location
                <input id="locationInput" type="text" value="Forest of Hollow Pine" />
              </label>

              <label>
                Session
                <input id="sessionInput" type="text" value="Session 01" />
              </label>

              <label>
                Image URL
                <input id="imageInput" type="url" value="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80" />
              </label>

              <label>
                Summary
                <textarea id="summaryInput">The party enters the Blackbriar frontier, where a forgotten lantern is said to have warmed the land before the first winter of ruin.</textarea>
              </label>

              <div class="coord-grid">
                <label>
                  X %
                  <input id="xInput" type="number" min="0" max="100" step="1" value="26" />
                </label>
                <label>
                  Y %
                  <input id="yInput" type="number" min="0" max="100" step="1" value="32" />
                </label>
              </div>

              <div class="button-row">
                <button id="deletePointBtn" class="alert" type="button">Delete Point</button>
              </div>
            </form>

            <div id="statusText" class="status-text" aria-live="polite"></div>
          </div>
        </aside>
      </main>
    </div>

    <script>
      const STORAGE_KEY = 'firstLightCampaignMapData';
      const DEFAULT_POINTS = [
        {
          title: 'The Whispering Forest',
          location: 'Forest of Hollow Pine',
          session: 'Session 01',
          summary: 'The party enters the Blackbriar frontier, where a forgotten lantern is said to have warmed the land before the first winter of ruin.',
          image: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80',
          x: 26,
          y: 32
        },
        {
          title: 'Ashes of the Moor',
          location: 'The Emberfen',
          session: 'Session 02',
          summary: 'A ruined keep rises from a field of smoldering heather, where the cult’s first ash-mark is found beneath a collapsed bell tower.',
          image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80',
          x: 48,
          y: 49
        },
        {
          title: 'The Shattered Tide',
          location: 'Nightmere Coast',
          session: 'Session 03',
          summary: 'A drowned chapel and black tide pull the party toward an enemy they cannot name, where sea sigils pulse beneath the moon.',
          image: 'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=80',
          x: 75,
          y: 67
        },
        {
          title: 'The Iron Ridge',
          location: 'Stormglass Peaks',
          session: 'Session 04',
          summary: 'The mountains answer with thunder and glacier-cold silence. Within the ruined fortress, a crown of stormsteel is hidden.',
          image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80',
          x: 35,
          y: 68
        },
        {
          title: 'The Glass Marsh',
          location: 'Mire of Sable Reed',
          session: 'Session 05',
          summary: 'The marsh gleams like broken glass beneath the twilight, full of whispering reeds and old forbidden oaths.',
          image: 'https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1200&q=80',
          x: 58,
          y: 78
        },
        {
          title: 'The Vault of Echoes',
          location: 'Lair of Silent Bells',
          session: 'Session 06',
          summary: 'Beneath the ruins of a collapsed citadel, a chamber of listening stone stores every memory in a different bell tone.',
          image: 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80',
          x: 66,
          y: 42
        },
        {
          title: 'The Hollow Crown',
          location: 'Fane of Last Winter',
          session: 'Session 07',
          summary: 'A dead throne room opens beneath a frozen shrine, revealing the final living remnant of a kingdom that chose ritual over mercy.',
          image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80',
          x: 23,
          y: 74
        },
        {
          title: 'First Dawn',
          location: 'Skyreach Observatory',
          session: 'Session 08',
          summary: 'At the peak of the world, the signal of the first dawn waits under a temple of stars and the campaign’s final cost.',
          image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80',
          x: 50,
          y: 20
        }
      ];

      const mapStage = document.getElementById('mapStage');
      const titleInput = document.getElementById('titleInput');
      const locationInput = document.getElementById('locationInput');
      const sessionInput = document.getElementById('sessionInput');
      const summaryInput = document.getElementById('summaryInput');
      const imageInput = document.getElementById('imageInput');
      const xInput = document.getElementById('xInput');
      const yInput = document.getElementById('yInput');
      const mapTitle = document.getElementById('map-title');
      const mapSummary = document.getElementById('map-summary');
      const mapLocation = document.getElementById('map-location');
      const mapSession = document.getElementById('map-session');
      const statusText = document.getElementById('statusText');
      const addPointBtn = document.getElementById('addPointBtn');
      const saveLocalBtn = document.getElementById('saveLocalBtn');
      const publishBtn = document.getElementById('publishBtn');
      const deletePointBtn = document.getElementById('deletePointBtn');

      let points = loadPoints();
      let selectedIndex = 0;
      let addMode = false;
      let dragIndex = null;

      function loadPoints() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(saved) && saved.length) return saved;
        } catch (error) {
          console.warn('Unable to load saved points', error);
        }
        return DEFAULT_POINTS; 
      }

      function persistPoints() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(points));
      }

      function setStatus(message) {
        statusText.textContent = message;
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function updateDetailPanel() {
        const point = points[selectedIndex];
        if (!point) return;
        mapTitle.textContent = point.title;
        mapSummary.textContent = point.summary;
        mapLocation.textContent = point.location;
        mapSession.textContent = point.session;
      }

      function syncFormToSelection() {
        const point = points[selectedIndex];
        if (!point) return;
        titleInput.value = point.title;
        locationInput.value = point.location;
        sessionInput.value = point.session;
        summaryInput.value = point.summary;
        imageInput.value = point.image;
        xInput.value = point.x;
        yInput.value = point.y;
        updateDetailPanel();
      }

      function readFormToSelection() {
        const point = points[selectedIndex];
        if (!point) return;
        point.title = titleInput.value.trim() || 'Unnamed Landmark';
        point.location = locationInput.value.trim() || 'Unknown Location';
        point.session = sessionInput.value.trim() || 'Session';
        point.summary = summaryInput.value.trim() || 'No summary available.';
        point.image = imageInput.value.trim() || 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80';
        point.x = clamp(Number(xInput.value || 0), 0, 100);
        point.y = clamp(Number(yInput.value || 0), 0, 100);
        persistPoints();
        renderPins();
        updateDetailPanel();
      }

      function makePin(point, index) {
        const pin = document.createElement('button');
        pin.type = 'button';
        pin.className = 'map-pin' + (index === selectedIndex ? ' selected' : '');
        pin.style.left = `${point.x}%`;
        pin.style.top = `${point.y}%`;
        pin.title = point.title;
        pin.setAttribute('aria-label', `${point.title} marker`);

        pin.addEventListener('click', (event) => {
          event.stopPropagation();
          selectedIndex = index;
          if (addMode) addMode = false;
          renderPins();
          syncFormToSelection();
        });

        pin.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          dragIndex = index;
          pin.setPointerCapture(event.pointerId);
        });

        return pin;
      }

      function renderPins() {
        const existingPins = mapStage.querySelectorAll('.map-pin');
        existingPins.forEach((pin) => pin.remove());

        points.forEach((point, index) => {
          const pin = makePin(point, index);
          mapStage.appendChild(pin);
        });
      }

      function addNewPointAt(xPercent, yPercent) {
        const newPoint = {
          title: 'New Landmark',
          location: 'Uncharted Site',
          session: 'Session',
          summary: 'A newly added landmark for the campaign.',
          image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80',
          x: clamp(xPercent, 0, 100),
          y: clamp(yPercent, 0, 100)
        };

        points.push(newPoint);
        selectedIndex = points.length - 1;
        addMode = false;
        persistPoints();
        renderPins();
        syncFormToSelection();
        setStatus('Added a new map point.');
      }

      function deleteSelectedPoint() {
        if (points.length <= 1) {
          setStatus('At least one point must remain on the map.');
          return;
        }

        points.splice(selectedIndex, 1);
        selectedIndex = Math.max(0, selectedIndex - 1);
        persistPoints();
        renderPins();
        syncFormToSelection();
        setStatus('Selected point deleted.');
      }

      mapStage.addEventListener('click', (event) => {
        if (event.target === mapStage || event.target.closest('img')) {
          if (addMode) {
            const rect = mapStage.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top) / rect.height) * 100;
            addNewPointAt(x, y);
          }
        }
      });

      document.addEventListener('pointermove', (event) => {
        if (dragIndex === null) return;
        const rect = mapStage.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;
        points[dragIndex].x = clamp(x, 0, 100);
        points[dragIndex].y = clamp(y, 0, 100);
        selectedIndex = dragIndex;
        persistPoints();
        renderPins();
        syncFormToSelection();
      });

      document.addEventListener('pointerup', () => {
        if (dragIndex !== null) {
          setStatus('Point moved.');
          dragIndex = null;
        }
      });

      titleInput.addEventListener('input', () => {
        readFormToSelection();
      });
      locationInput.addEventListener('input', () => readFormToSelection());
      sessionInput.addEventListener('input', () => readFormToSelection());
      summaryInput.addEventListener('input', () => readFormToSelection());
      imageInput.addEventListener('input', () => readFormToSelection());
      xInput.addEventListener('input', () => readFormToSelection());
      yInput.addEventListener('input', () => readFormToSelection());

      addPointBtn.addEventListener('click', () => {
        addMode = !addMode;
        setStatus(addMode ? 'Click anywhere on the map to place a new point.' : 'Add point mode turned off.');
      });

      saveLocalBtn.addEventListener('click', () => {
        persistPoints();
        setStatus('Map saved to browser storage.');
      });

      deletePointBtn.addEventListener('click', () => {
        deleteSelectedPoint();
      });

      publishBtn.addEventListener('click', async () => {
        const token = window.prompt('Paste a GitHub personal access token with repo contents write permission:', '');
        if (!token) {
          setStatus('No token provided; publish cancelled.');
          return;
        }

        const repoOwner = 'PseudoSyntax';
        const repoName = 'DnD-Tracker-First-Light';
        const filePath = 'campaign-data.json';

        try {
          const payload = JSON.stringify(points, null, 2);
          const encoder = new TextEncoder();
          const encoded = btoa(String.fromCharCode(...encoder.encode(payload)));

          const existingResponse = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
            headers: {
              'Authorization': `Bearer ${token}`,
              'Accept': 'application/vnd.github+json'
            }
          });

          let sha = null;
          if (existingResponse.ok) {
            const existing = await existingResponse.json();
            sha = existing.sha;
          }

          const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: 'Update campaign map data',
              content: encoded,
              sha: sha || undefined,
              branch: 'main'
            })
          });

          if (!response.ok) {
            const error = await response.text();
            throw new Error(error || 'GitHub publish failed.');
          }

          setStatus('Published to the main branch via GitHub API.');
        } catch (error) {
          console.error(error);
          setStatus('Publish failed. Check that the token has repo access and the branch is editable.');
        }
      });

      renderPins();
      syncFormToSelection();
      setStatus('Editing enabled. Click a point to edit it, or add a new one.');
    </script>
  </body>
</html>

    <script>
      const STORAGE_KEY = 'firstLightCampaignMapData';
      const TOKEN_STORAGE_KEY = 'firstLightGithubToken';
      const MAP_EDGE_PADDING = 8;
      const WORLD_OVERVIEW = {
        title: 'The Known World',
        location: 'The First Light Campaign',
        session: 'World Overview',
        summary: 'Across the broken frontier of the Old Kingdom, rival realms, haunted woods, and forgotten shrines shape the fate of the campaign. Some roads are safe, most are not, and every trail is a story waiting to be written.',
        image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80',
        x: 50,
        y: 50
      };
      const DEFAULT_POINTS = [
        {
          title: 'The Whispering Forest',
          location: 'Forest of Hollow Pine',
          session: 'Session 01',
          summary: 'The party enters the Blackbriar frontier, where a forgotten lantern is said to have warmed the land before the first winter of ruin.',
          image: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80',
          x: 26,
          y: 32
        },
        {
          title: 'Ashes of the Moor',
          location: 'The Emberfen',
          session: 'Session 02',
          summary: 'A ruined keep rises from a field of smoldering heather, where the cult’s first ash-mark is found beneath a collapsed bell tower.',
          image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80',
          x: 48,
          y: 49
        },
        {
          title: 'The Shattered Tide',
          location: 'Nightmere Coast',
          session: 'Session 03',
          summary: 'A drowned chapel and black tide pull the party toward an enemy they cannot name, where sea sigils pulse beneath the moon.',
          image: 'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=80',
          x: 75,
          y: 67
        },
        {
          title: 'The Iron Ridge',
          location: 'Stormglass Peaks',
          session: 'Session 04',
          summary: 'The mountains answer with thunder and glacier-cold silence. Within the ruined fortress, a crown of stormsteel is hidden.',
          image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80',
          x: 35,
          y: 68
        },
        {
          title: 'The Glass Marsh',
          location: 'Mire of Sable Reed',
          session: 'Session 05',
          summary: 'The marsh gleams like broken glass beneath the twilight, full of whispering reeds and old forbidden oaths.',
          image: 'https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1200&q=80',
          x: 58,
          y: 78
        },
        {
          title: 'The Vault of Echoes',
          location: 'Lair of Silent Bells',
          session: 'Session 06',
          summary: 'Beneath the ruins of a collapsed citadel, a chamber of listening stone stores every memory in a different bell tone.',
          image: 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80',
          x: 66,
          y: 42
        },
        {
          title: 'The Hollow Crown',
          location: 'Fane of Last Winter',
          session: 'Session 07',
          summary: 'A dead throne room opens beneath a frozen shrine, revealing the final living remnant of a kingdom that chose ritual over mercy.',
          image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80',
          x: 23,
          y: 74
        },
        {
          title: 'First Dawn',
          location: 'Skyreach Observatory',
          session: 'Session 08',
          summary: 'At the peak of the world, the signal of the first dawn waits under a temple of stars and the campaign’s final cost.',
          image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80',
          x: 50,
          y: 20
        }
      ];

      const mapLayout = document.getElementById('mapLayout');
      const mapStage = document.getElementById('mapStage');
      const mapImage = document.querySelector('.map-image');
      const mapViewport = document.createElement('div');
      mapViewport.className = 'map-viewport';
      mapStage.insertBefore(mapViewport, mapStage.firstChild);
      mapViewport.appendChild(mapImage);

      const titleInput = document.getElementById('titleInput');
      const locationInput = document.getElementById('locationInput');
      const sessionInput = document.getElementById('sessionInput');
      const summaryInput = document.getElementById('summaryInput');
      const imageInput = document.getElementById('imageInput');
      const xInput = document.getElementById('xInput');
      const yInput = document.getElementById('yInput');
      const mapTitle = document.getElementById('map-title');
      const mapSummary = document.getElementById('map-summary');
      const mapLocation = document.getElementById('map-location');
      const mapSession = document.getElementById('map-session');
      const statusText = document.getElementById('statusText');
      const addPointBtn = document.getElementById('addPointBtn');
      const connectTokenBtn = document.getElementById('connectTokenBtn');
      const saveLocalBtn = document.getElementById('saveLocalBtn');
      const publishBtn = document.getElementById('publishBtn');
      const deletePointBtn = document.getElementById('deletePointBtn');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      const panelToggleBtn = document.getElementById('panelToggleBtn');

      let points = loadPoints();
      let selectedIndex = null;
      let addMode = false;
      let dragIndex = null;
      let zoom = 1;
      let dragPan = null;
      let panelOpen = false;

      const MIN_ZOOM = 0.6;
      const MAX_ZOOM = 2.2;
      const ZOOM_STEP = 0.2;

      function normalizePointValue(value, fallback = 50) {
        const numericValue = Number(value);
        if (!Number.isFinite(numericValue)) return fallback;
        return clamp(numericValue, MAP_EDGE_PADDING, 100 - MAP_EDGE_PADDING);
      }

      function getPanLimits() {
        const stageWidth = mapStage.clientWidth;
        const stageHeight = mapStage.clientHeight;
        const imageWidth = mapImage.naturalWidth || stageWidth;
        const imageHeight = mapImage.naturalHeight || stageHeight;
        const scaledWidth = imageWidth * zoom;
        const scaledHeight = imageHeight * zoom;
        const maxX = Math.max(0, (scaledWidth - stageWidth) / 2);
        const maxY = Math.max(0, (scaledHeight - stageHeight) / 2);
        return { maxX, maxY, scaledWidth, scaledHeight, stageWidth, stageHeight };
      }

      function isZoomedInToLocation() {
        return zoom > 1.05;
      }

      function shouldAutoRecenter() {
        if (isZoomedInToLocation()) {
          return false;
        }

        const { scaledWidth, scaledHeight, stageWidth, stageHeight } = getPanLimits();
        const currentX = Number(mapViewport.dataset.offsetX || 0);
        const currentY = Number(mapViewport.dataset.offsetY || 0);

        return (
          Math.abs(currentX) > 0.5 ||
          Math.abs(currentY) > 0.5 ||
          scaledWidth > stageWidth + 1 ||
          scaledHeight > stageHeight + 1
        );
      }

      function syncPanPosition() {
        const { maxX, maxY } = getPanLimits();
        const currentX = Number(mapViewport.dataset.offsetX || 0);
        const currentY = Number(mapViewport.dataset.offsetY || 0);

        if (shouldAutoRecenter()) {
          mapViewport.dataset.offsetX = '0';
          mapViewport.dataset.offsetY = '0';
          mapViewport.style.transform = `translate(0px, 0px) scale(${zoom})`;
          return;
        }

        const nextX = clamp(currentX, -maxX, maxX);
        const nextY = clamp(currentY, -maxY, maxY);

        mapViewport.dataset.offsetX = String(nextX);
        mapViewport.dataset.offsetY = String(nextY);
        mapViewport.style.transform = `translate(${nextX}px, ${nextY}px) scale(${zoom})`;
      }

      function setPanelOpen(nextState) {
        panelOpen = nextState;
        mapLayout.classList.toggle('with-panel', panelOpen);
        panelToggleBtn.setAttribute('aria-expanded', String(panelOpen));
        panelToggleBtn.textContent = panelOpen ? '✕' : '✎';
        panelToggleBtn.title = panelOpen ? 'Hide map details' : 'Open map details';
      }

      function loadPoints() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(saved) && saved.length) {
            return saved.map((point) => ({
              ...point,
              x: normalizePointValue(point.x, 50),
              y: normalizePointValue(point.y, 50)
            }));
          }
        } catch (error) {
          console.warn('Unable to load saved points', error);
        }
        return DEFAULT_POINTS;
      }

      function persistPoints() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(points));
      }

      function loadToken() {
        return localStorage.getItem(TOKEN_STORAGE_KEY) || '';
      }

      function saveToken(token) {
        if (!token || !token.trim()) {
          localStorage.removeItem(TOKEN_STORAGE_KEY);
          return;
        }
        localStorage.setItem(TOKEN_STORAGE_KEY, token.trim());
      }

      function syncPublishButton() {
        const token = loadToken();
        const hasToken = Boolean(token && token.trim());
        publishBtn.disabled = !hasToken;
        publishBtn.textContent = hasToken ? 'Publish to Main' : 'Publish Disabled';
        connectTokenBtn.textContent = hasToken ? 'Update GitHub Token' : 'Add GitHub Token';
        publishBtn.title = hasToken
          ? 'Ready to publish to GitHub.'
          : 'Add a GitHub token with repo write access to enable publishing.';
      }

      function setStatus(message) {
        statusText.textContent = message;
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function updateZoomButtons() {
        zoomInBtn.disabled = zoom >= MAX_ZOOM;
        zoomOutBtn.disabled = zoom <= MIN_ZOOM;
      }

      function applyZoom() {
        syncPanPosition();
        updateZoomButtons();
      }

      function zoomMap(direction) {
        const nextZoom = clamp(zoom + direction * ZOOM_STEP, MIN_ZOOM, MAX_ZOOM);
        if (nextZoom === zoom) return;
        zoom = nextZoom;
        applyZoom();
        setStatus(`Map zoom: ${zoom.toFixed(1)}x`);
      }

      function updateDetailPanel() {
        const point = selectedIndex !== null && points[selectedIndex] ? points[selectedIndex] : null;

        if (!point) {
          mapTitle.textContent = WORLD_OVERVIEW.title;
          mapSummary.textContent = WORLD_OVERVIEW.summary;
          mapLocation.textContent = WORLD_OVERVIEW.location;
          mapSession.textContent = WORLD_OVERVIEW.session;
          return;
        }

        mapTitle.textContent = point.title;
        mapSummary.textContent = point.summary;
        mapLocation.textContent = point.location;
        mapSession.textContent = point.session;
      }

      function syncFormToSelection() {
        const point = selectedIndex !== null && points[selectedIndex] ? points[selectedIndex] : null;

        if (!point) {
          titleInput.value = '';
          locationInput.value = '';
          sessionInput.value = '';
          summaryInput.value = '';
          imageInput.value = '';
          xInput.value = 50;
          yInput.value = 50;
          updateDetailPanel();
          return;
        }

        titleInput.value = point.title;
        locationInput.value = point.location;
        sessionInput.value = point.session;
        summaryInput.value = point.summary;
        imageInput.value = point.image;
        xInput.value = point.x;
        yInput.value = point.y;
        updateDetailPanel();
      }

      function readFormToSelection() {
        if (selectedIndex === null) return;
        const point = points[selectedIndex];
        if (!point) return;
        point.title = titleInput.value.trim() || 'Unnamed Landmark';
        point.location = locationInput.value.trim() || 'Unknown Location';
        point.session = sessionInput.value.trim() || 'Session';
        point.summary = summaryInput.value.trim() || 'No summary available.';
        point.image = imageInput.value.trim() || 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80';
        point.x = normalizePointValue(xInput.value || 0, 50);
        point.y = normalizePointValue(yInput.value || 0, 50);
        persistPoints();
        renderPins();
        updateDetailPanel();
      }

      function makePin(point, index) {
        const pin = document.createElement('button');
        pin.type = 'button';
        pin.className = 'map-pin' + (index === selectedIndex ? ' selected' : '');
        pin.style.left = `${point.x}%`;
        pin.style.top = `${point.y}%`;
        pin.title = point.title;
        pin.setAttribute('aria-label', `${point.title} marker`);

        pin.addEventListener('click', (event) => {
          event.stopPropagation();
          selectedIndex = index;
          if (addMode) addMode = false;
          renderPins();
          syncFormToSelection();
        });

        pin.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          dragIndex = index;
          pin.setPointerCapture(event.pointerId);
        });

        return pin;
      }

      function renderPins() {
        const existingPins = mapViewport.querySelectorAll('.map-pin');
        existingPins.forEach((pin) => pin.remove());

        points.forEach((point, index) => {
          const pin = makePin(point, index);
          mapViewport.appendChild(pin);
        });
      }

      function addNewPointAt(xPercent, yPercent) {
        const newPoint = {
          title: 'New Landmark',
          location: 'Uncharted Site',
          session: 'Session',
          summary: 'A newly added landmark for the campaign.',
          image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80',
          x: normalizePointValue(xPercent, 50),
          y: normalizePointValue(yPercent, 50)
        };

        points.push(newPoint);
        selectedIndex = points.length - 1;
        addMode = false;
        persistPoints();
        renderPins();
        syncFormToSelection();
        setStatus('Added a new map point.');
      }

      function deleteSelectedPoint() {
        if (selectedIndex === null) {
          setStatus('Select a location before deleting it.');
          return;
        }

        if (points.length <= 1) {
          setStatus('At least one point must remain on the map.');
          return;
        }

        points.splice(selectedIndex, 1);
        selectedIndex = points.length ? 0 : null;
        persistPoints();
        renderPins();
        syncFormToSelection();
        setStatus('Selected point deleted.');
      }

      mapStage.addEventListener('click', (event) => {
        if (event.target === mapStage || event.target.closest('.map-image')) {
          if (addMode) {
            const rect = mapStage.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top) / rect.height) * 100;
            addNewPointAt(x, y);
          }
        }
      });

      document.addEventListener('pointermove', (event) => {
        if (dragIndex === null && dragPan === null) return;

        if (dragIndex !== null) {
          const rect = mapStage.getBoundingClientRect();
          const x = ((event.clientX - rect.left) / rect.width) * 100;
          const y = ((event.clientY - rect.top) / rect.height) * 100;
          points[dragIndex].x = normalizePointValue(x, 50);
          points[dragIndex].y = normalizePointValue(y, 50);
          selectedIndex = dragIndex;
          persistPoints();
          renderPins();
          syncFormToSelection();
        }

        if (dragPan) {
          const dx = event.clientX - dragPan.x;
          const dy = event.clientY - dragPan.y;
          dragPan.x = event.clientX;
          dragPan.y = event.clientY;

          const current = Number(mapViewport.dataset.offsetX || 0);
          const currentY = Number(mapViewport.dataset.offsetY || 0);
          const { maxX, maxY } = getPanLimits();

          if (shouldAutoRecenter()) {
            mapViewport.dataset.offsetX = '0';
            mapViewport.dataset.offsetY = '0';
            mapViewport.style.transform = `translate(0px, 0px) scale(${zoom})`;
            return;
          }

          const nextX = clamp(current + dx / zoom, -maxX, maxX);
          const nextY = clamp(currentY + dy / zoom, -maxY, maxY);

          mapViewport.dataset.offsetX = String(nextX);
          mapViewport.dataset.offsetY = String(nextY);
          mapViewport.style.transform = `translate(${nextX}px, ${nextY}px) scale(${zoom})`;
        }
      });

      document.addEventListener('pointerup', () => {
        if (dragIndex !== null) {
          setStatus('Point moved.');
          dragIndex = null;
        }
        if (dragPan) {
          dragPan = null;
        }
      });

      mapStage.addEventListener('pointerdown', (event) => {
        if (event.target.closest('.map-pin')) return;
        if (event.button !== 0) return;
        dragPan = { x: event.clientX, y: event.clientY };
        mapStage.classList.add('dragging');
      });

      mapStage.addEventListener('pointerleave', () => {
        if (dragPan) {
          dragPan = null;
          mapStage.classList.remove('dragging');
        }
      });

      panelToggleBtn.addEventListener('click', () => {
        setPanelOpen(!panelOpen);
        if (!panelOpen) {
          updateDetailPanel();
        }
      });

      titleInput.addEventListener('input', () => readFormToSelection());
      locationInput.addEventListener('input', () => readFormToSelection());
      sessionInput.addEventListener('input', () => readFormToSelection());
      summaryInput.addEventListener('input', () => readFormToSelection());
      imageInput.addEventListener('input', () => readFormToSelection());
      xInput.addEventListener('input', () => readFormToSelection());
      yInput.addEventListener('input', () => readFormToSelection());

      addPointBtn.addEventListener('click', () => {
        addMode = !addMode;
        setStatus(addMode ? 'Click anywhere on the map to place a new point.' : 'Add point mode turned off.');
      });

      connectTokenBtn.addEventListener('click', () => {
        const existingToken = loadToken();
        const enteredToken = window.prompt(
          'Paste a GitHub personal access token with repo contents: write access.',
          existingToken || ''
        );

        if (enteredToken === null) {
          setStatus('GitHub token entry cancelled.');
          return;
        }

        if (!enteredToken || !enteredToken.trim()) {
          saveToken('');
          syncPublishButton();
          setStatus('No token saved. Publishing remains disabled.');
          return;
        }

        saveToken(enteredToken);
        syncPublishButton();
        setStatus('GitHub token saved in browser storage.');
      });

      saveLocalBtn.addEventListener('click', () => {
        persistPoints();
        setStatus('Map saved to browser storage.');
      });

      deletePointBtn.addEventListener('click', () => {
        deleteSelectedPoint();
      });

      zoomInBtn.addEventListener('click', () => zoomMap(1));
      zoomOutBtn.addEventListener('click', () => zoomMap(-1));

      publishBtn.addEventListener('click', async () => {
        const token = loadToken();
        if (!token) {
          setStatus('No token detected. Add a GitHub token before publishing.');
          return;
        }

        const repoOwner = 'PseudoSyntax';
        const repoName = 'DnD-Tracker-First-Light';
        const filePath = 'campaign-data.json';

        try {
          const payload = JSON.stringify(points, null, 2);
          const content = btoa(unescape(encodeURIComponent(payload)));

          const existingResponse = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
            headers: {
              'Authorization': `Bearer ${token}`,
              'Accept': 'application/vnd.github+json'
            }
          });

          let sha = null;
          if (existingResponse.ok) {
            const existing = await existingResponse.json();
            sha = existing.sha;
          }

          const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: 'Update campaign map data',
              content: content,
              sha: sha || undefined,
              branch: 'main'
            })
          });

          if (!response.ok) {
            const error = await response.text();
            throw new Error(error || 'GitHub publish failed.');
          }

          setStatus('Published to the main branch via GitHub API.');
        } catch (error) {
          console.error(error);
          setStatus('Publish failed. Check the token, repo access, and branch permissions.');
        }
      });

      renderPins();
      syncFormToSelection();
      syncPublishButton();
      setPanelOpen(false);
      applyZoom();
      setStatus('Click the pencil to view the world summary, or click a point to inspect a location.');
    </script>

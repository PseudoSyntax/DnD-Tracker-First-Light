<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Interactive campaign map for the First Light adventure." />
    <title>First Light | Interactive Campaign Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="map.css" />
  </head>
  <body>
    <div class="map-page">
      <header class="topbar">
        <a class="back-link" href="index.html">← Return to Journal</a>
        <h1 class="header-title">Campaign Atlas</h1>
      </header>
      <main class="map-layout with-panel" id="mapLayout">
        <div class="map-stage-wrap">
          <div class="toolbar" role="toolbar" aria-label="Map options">
            <button id="routeBtn" type="button" aria-pressed="true">Route</button>
            <button id="labelsBtn" type="button" aria-pressed="true">Labels</button>
          </div>
          <button id="panelToggleBtn" class="panel-toggle" type="button" aria-label="Toggle map details" aria-expanded="true">✎</button>
          <div
            class="map-stage"
            id="mapStage"
            tabindex="0"
            role="application"
            aria-label="Interactive campaign map. Drag to pan, scroll or pinch to zoom. With the map focused, use arrow keys to pan and plus or minus to zoom."
          >
            <div class="map-viewport" id="mapViewport">
              <img class="map-image" id="mapImage" src="image-1.webp" alt="Campaign map" width="2048" height="1536" draggable="false" decoding="async" />
              <svg class="map-route" id="mapRoute" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline id="routeLine" points="" /></svg>
            </div>
            <div class="zoom-controls" aria-label="Map zoom controls">
              <button id="zoomInBtn" type="button" aria-label="Zoom in">+</button>
              <button id="zoomOutBtn" type="button" aria-label="Zoom out">−</button>
              <button id="fitBtn" type="button" aria-label="Reset view" title="Reset view">⌂</button>
            </div>
          </div>
          <p class="map-hint" id="mapHint">Drag to pan · scroll or pinch to zoom</p>
        </div>
        <aside class="map-details" id="mapDetails" aria-live="polite">
          <p class="panel-kicker" id="panelKicker">Waypoint</p>
          <div class="chapter-summary" id="viewPanel">
            <h2 id="map-title">The Known World</h2>
            <p id="map-summary"></p>
            <div class="meta-list"><span id="map-location"></span><span id="map-session"></span></div>
          </div>
          <form class="editor" id="editorForm" hidden autocomplete="off">
            <label>Title<input name="title" type="text" /></label>
            <label>Location<input name="location" type="text" /></label>
            <label>Session<input name="session" type="text" /></label>
            <label>Summary<textarea name="summary" rows="4"></textarea></label>
            <label>Description<textarea name="description" rows="3"></textarea></label>
            <div class="coords">
              <label>X (%)<input name="x" type="number" min="0" max="100" step="0.5" /></label>
              <label>Y (%)<input name="y" type="number" min="0" max="100" step="0.5" /></label>
            </div>
          </form>
          <div class="nav-row" id="navRow">
            <button class="btn" id="prevBtn" type="button">← Prev</button>
            <button class="btn" id="nextBtn" type="button">Next →</button>
            <a class="btn" id="journalLink" href="index.html" hidden>Open in journal</a>
          </div>
          <div class="detail-actions"><span class="toggle-label">Edit mode</span><button id="editModeBtn" class="edit-toggle" type="button" aria-pressed="false">Off</button></div>
          <div id="editTools" hidden>
            <p class="location-description">Drag a marker, or select one and use the arrow keys (hold Shift for larger steps). Edits stay in this browser until you export them and commit <code>campaign-data.json</code>.</p>
            <div class="editor-tools">
              <button class="btn primary" id="exportBtn" type="button">Export JSON</button>
              <button class="btn" id="importBtn" type="button">Import JSON</button>
              <button class="btn" id="resetBtn" type="button">Discard local edits</button>
            </div>
            <input id="importFile" type="file" accept="application/json,.json" hidden />
          </div>
          <p class="status-line" id="statusLine" role="status"></p>
          <p class="location-description" id="locationDescription"></p>
        </aside>
      </main>
    </div>
    <script src="data.js"></script>
    <script src="map.js"></script>
  </body>
</html>

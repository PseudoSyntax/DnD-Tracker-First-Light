<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Light | Campaign Journal</title>
    <meta
      name="description"
      content="A chapter-based DnD campaign tracker for the First Light adventure."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="campaign-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <p class="tag">Campaign Journal</p>
          <h1>First Light</h1>
        </div>
        <div class="campaign-meta">
          <span>Part I</span>
          <span>8 Sessions</span>
        </div>
      </header>

      <main class="chapter-layout">
        <section class="chapter-hero" id="chapter-hero">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <p class="chapter-kicker">Current Chapter</p>
            <h2 id="hero-title">The Whispering Forest</h2>
            <p id="hero-summary"></p>
            <div class="hero-meta">
              <span id="hero-location">Forest of Hollow Pine</span>
              <span id="hero-session">Session 01</span>
            </div>
          </div>
        </section>

        <aside class="chapter-panel" aria-label="Campaign chapters">
          <div class="panel-heading">
            <p class="tag">Trail Map</p>
            <h3>Chapters</h3>
          </div>
          <div id="chapter-list" class="chapter-list"></div>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
